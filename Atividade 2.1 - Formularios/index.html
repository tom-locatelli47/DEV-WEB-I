<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 2.1 Fomularios</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Formulario de contato</h1>
        <form action="#">
          <p>
            <label for="nome">*Nome: </label><input type="text" id="nome" />
          </p>
          <p>
            <label for="email">*Email: </label><input type="email" id="email" />
          </p>
          <p>
            <label for="telefone">*Telefone: </label
            ><input type="tel" id="telefone" />
          </p>
          <p>
            <label for="setor">Setor: </label>
            <select id="setor">
              <option value="vendas">Vendas</option>
              <option value="administrativo">Administrativo</option>
              <option value="rh">RH</option>
            </select>
          </p>
          <p>
            <label for="mensagem">Mensagem:</label>
            <textarea cols="30" rows="10" id="mensagem"></textarea>
          </p>
          <fieldset>
            <legend>Cominucição urgente:</legend>
            <label><input name="urgencia" type="radio" />Sim</label>
            <label><input name="urgencia" type="radio" />Não</label>
          </fieldset>
          <fieldset>
            <legend>Obtive conhecimento do projeto:</legend>
            <label><input type="checkbox" />Buscador</label>
            <label><input type="checkbox" />Publicado em video</label>
            <label><input type="checkbox" />Amigos</label>
            <label><input type="checkbox" />Email</label>
            <label><input type="checkbox" />Outros</label>
          </fieldset>
          <p>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
