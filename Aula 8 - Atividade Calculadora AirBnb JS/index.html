<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aulo 8 - Atividade Airbnb</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <section>
        <form action="">
          <h1>
            <span id="preco_diaria">R$620</span
            ><span class="pequeno">noite</span>
          </h1>
          <div class="todos">
            <div class="datas">
              <div class="esq">
                <p><label for="checkin">CHECK-IN</label></p>
                <input
                  class="data"
                  type="date"
                  required
                  name="checkin"
                  id="checkin" />
              </div>
              <div>
                <p><label for="checkout">CHECKOUT</label></p>
                <input
                  class="data"
                  type="date"
                  required
                  name="checkout"
                  id="checkout" />
              </div>
            </div>
            <div class="hospedes">
              <p><label for="hospede">HÓSPEDES</label></p>
              <select name="hospede" id="hospede">
                <option value="1">1 Hóspede</option>
                <option value="2">2 Hóspedes</option>
                <option value="3">3 Hóspedes</option>
                <option value="4">4 Hóspedes</option>
              </select>
            </div>
          </div>
          <button id="reserva">Reservar</button>
        </form>
        <div class="results">
          <p>Você ainda não será cobrado</p>
          <div class="listas">
            <ul>
              <li>
                <span id="subtotal">R$620 X 5 noites</span>
              </li>
              <li>
                <span>Taxa de limpeza</span>
              </li>
              <li>
                <span>Taxa de serviço do Airbnb</span>
              </li>
            </ul>
            <ul>
              <li>
                <p><span id="valorsub">R$3.100</span></p>
              </li>
              <li>
                <p><span id="limpeza">R$120</span></p>
              </li>
              <li>
                <p><span id="taxa">R$468</span></p>
              </li>
            </ul>
          </div>
          <hr />
          <p>Total sem impostos: <span id="total">R$3.688</span></p>
        </div>
      </section>
      <script>
        let reserva = document.getElementById("reserva");
        let checkout = document.getElementById("checkout");

        checkout.addEventListener("change", function () {
          let data_saida = new Date(this.value);
          let data_entrada = new Date(document.getElementById("checkin").value);
          let diarias = (data_saida - data_entrada) / 86400000;

          let preco_diaria = parseFloat(
            document.getElementById("preco_diaria").innerText.substring(2)
          );

          let subtotal = document.getElementById("subtotal");
          subtotal.innerText =
            "R$" + preco_diaria + " X " + diarias + " noites";

          let hospedes = document.getElementById("hospede").value;

          let valorsub = document.getElementById("valorsub");
          let valor_sube = preco_diaria * (1 + 0.2 * (hospedes - 1)) * diarias;
          valorsub.innerText = "R$" + valor_sube;

          let taxa = document.getElementById("taxa");
          let valor_taxa = valor_sube * 0.15;
          taxa.innerText = "R$" + valor_taxa;

          let limpeza = document.getElementById("limpeza");
          let valor_limpeza = parseFloat(limpeza.innerText.substring(2));
          console.log(valor_limpeza);
          limpeza.innerText = "R$" + valor_limpeza;

          let total = document.getElementById("total");
          total.innerText = "R$" + (valor_sube + valor_limpeza + valor_taxa);
        });
      </script>
    </main>
  </body>
</html>
